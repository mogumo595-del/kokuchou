<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>データ集計ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px auto; max-width: 900px; }
  h1 { text-align: center; margin-bottom: 30px; }
  .upload-area, .filter-area { margin-bottom: 20px; }
  label { margin-right: 12px; font-weight: bold; }
  select, button, input[type="file"] { padding: 6px 10px; font-size: 14px; }
  #chartContainer { max-width: 800px; margin-top: 30px; }
</style>
</head>
<body>

<h1>データ集計ダッシュボード</h1>

<div class="upload-area">
  <label for="csvFileInput">CSVファイルを選択：</label>
  <input type="file" id="csvFileInput" accept=".csv" />
  <button id="uploadBtn">アップロード実行</button>
</div>

<div class="filter-area">
  <label for="prefectureSelect">都道府県で絞り込み：</label>
  <select id="prefectureSelect" disabled>
    <option value="">-- 都道府県を選択 --</option>
  </select>

  <label for="municipalitySelect">市区町村で絞り込み：</label>
  <select id="municipalitySelect" disabled>
    <option value="">-- 市区町村を選択 --</option>
  </select>
</div>

<div id="chartContainer">
  <canvas id="populationChart"></canvas>
</div>

<script>
  let rawData = [];             // アップロードCSVの全データ保持
  let uniquePrefectures = [];  // 抽出した都道府県リスト
  let filteredMunicipalities = []; // フィルター後の市区町村リスト

  const csvFileInput = document.getElementById('csvFileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const prefectureSelect = document.getElementById('prefectureSelect');
  const municipalitySelect = document.getElementById('municipalitySelect');
  const ctx = document.getElementById('populationChart').getContext('2d');
  let populationChart;

  // 簡易CSVパース（ヘッダー付きカンマ区切り、改行あり）
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    // ヘッダーはスペースやタブの混入が有る場合があるのでカンマ区切り後、トリム
    const headers = lines[0].split(',').map(h => h.trim());
    const rows = lines.slice(1).map(line => {
      const values = line.split(',').map(v => v.trim());
      let rowObj = {};
      headers.forEach((h, i) => {
        rowObj[h] = values[i] !== undefined ? values[i] : '';
      });
      return rowObj;
    });
    return rows;
  }

  // 「都道府県」「市区町村」カラム名候補を判定
  // ご提示のデータを省略・簡易化した想定カラム名に合わせています。
  function detectPrefectureMunicipalityKeys(headers) {
    let prefKeys = headers.filter(h => /(全国|都道府県|県|市区町村|location|prefecture)/i.test(h));
    let muniKeys = headers.filter(h => /(市|区|町|村|municipality|city|area)/i.test(h));
    // ざっくりと、一致した最初のものを返す
    return {
      prefKey: prefKeys.length ? prefKeys[0] : null,
      muniKey: muniKeys.length ? muniKeys[0] : null
    };
  }

  function getValueOrZero(obj, keys) {
    for (const key of keys) {
      if (obj[key] && obj[key] !== '') {
        let num = Number(obj[key].replace(/,/g, '')); // カンマ除去して数値化
        if (!isNaN(num)) return num;
      }
    }
    return 0;
  }

  // アップロード実行
  uploadBtn.addEventListener('click', () => {
    const file = csvFileInput.files[0];
    if (!file) {
      alert('CSVファイルを選択してください。');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      let text = reader.result;

      // 特定のヘッダーや空行が存在する形式の場合は事前に不要行をスキップする処理が必要です。
      // ご提供データは先頭に説明行等が複数あるため簡略化のためここではフルデータの先頭数行削除を例示
      // 必要に応じてカスタマイズしてください。

      // 先頭に説明行などがあるケースを以下で落とし、最初にカンマ区切りのヘッダー行を探す例：
      const lines = text.split(/\r?\n/);
      let headerLineIndex = lines.findIndex(line => line.includes(','));
      if(headerLineIndex < 0) {
        alert('CSVファイルの形式が不正です。');
        return;
      }
      const csvText = lines.slice(headerLineIndex).join('\n');

      rawData = parseCSV(csvText);
      if(rawData.length === 0) {
        alert('CSVファイルに有効なデータがありません。');
        return;
      }

      // ヘッダーから都道府県・市区町村カラム名判定
      const headers = Object.keys(rawData[0]);
      const { prefKey, muniKey } = detectPrefectureMunicipalityKeys(headers);
      if(!prefKey || !muniKey) {
        alert('CSVの都道府県、市区町村を示すカラムが検出できません。カラム名を確認してください。');
        return;
      }

      // 都道府県リスト作成（重複除去）
      let prefecturesSet = new Set();
      rawData.forEach(row => {
        const prefName = row[prefKey];
        if(prefName && prefName.trim() !== '') {
          prefecturesSet.add(prefName.trim());
        }
      });
      uniquePrefectures = Array.from(prefecturesSet).sort();

      // 都道府県セレクト更新
      prefectureSelect.innerHTML = `<option value="">-- 都道府県を選択 --</option>`;
      uniquePrefectures.forEach(pref => {
        const opt = document.createElement('option');
        opt.value = pref;
        opt.textContent = pref;
        prefectureSelect.appendChild(opt);
      });
      prefectureSelect.disabled = false;

      // 市区町村セレクト初期化
      municipalitySelect.innerHTML = `<option value="">-- 市区町村を選択 --</option>`;
      municipalitySelect.disabled = true;

      // グラフ全体表示（アップロード直後は絞り込みなし）
      updateChart(rawData, prefKey, muniKey);

      alert('アップロード完了しました。');
    };
    reader.readAsText(file);
  });


  // 都道府県変化時
  prefectureSelect.addEventListener('change', () => {
    const selectedPref = prefectureSelect.value;
    if(!selectedPref) {
      // 県選択解除時は市区町村選択不可、グラフは全体
      municipalitySelect.innerHTML = `<option value="">-- 市区町村を選択 --</option>`;
      municipalitySelect.disabled = true;
      updateChart(rawData, null, null);
      return;
    }
    // 選択県に属する市区町村を抽出
    const headers = Object.keys(rawData[0]);
    const { prefKey, muniKey } = detectPrefectureMunicipalityKeys(headers);

    filteredMunicipalities = rawData
      .filter(row => row[prefKey] === selectedPref)
      .map(row => row[muniKey])
      .filter(v => v && v.trim() !== '');
    const uniqueMuni = Array.from(new Set(filteredMunicipalities)).sort();

    municipalitySelect.innerHTML = `<option value="">-- 市区町村を選択 --</option>`;
    uniqueMuni.forEach(muni => {
      const opt = document.createElement('option');
      opt.value = muni;
      opt.textContent = muni;
      municipalitySelect.appendChild(opt);
    });
    municipalitySelect.disabled = false;

    updateChart(rawData.filter(row => row[prefKey] === selectedPref), prefKey, muniKey);
  });

  // 市区町村変化時
  municipalitySelect.addEventListener('change', () => {
    const selectedPref = prefectureSelect.value;
    const selectedMuni = municipalitySelect.value;
    const headers = Object.keys(rawData[0]);
    const { prefKey, muniKey } = detectPrefectureMunicipalityKeys(headers);

    let filteredData = rawData;
    if(selectedPref) {
      filteredData = filteredData.filter(row => row[prefKey] === selectedPref);
    }
    if(selectedMuni) {
      filteredData = filteredData.filter(row => row[muniKey] === selectedMuni);
    }
    updateChart(filteredData, prefKey, muniKey);
  });

  // グラフ更新関数
  function updateChart(data, prefKey, muniKey) {
    if(populationChart) {
      populationChart.destroy();
    }
    // 表示データの「総数」や「総人口」に相当するカラムを推定(例: /男女 総数, 総数, 合計など)
    const sumKeys = Object.keys(data[0] || {}).filter(k => /(総数|人口|合計|total)/i.test(k));

    if(data.length === 0 || sumKeys.length === 0) {
      // データがなければ空グラフ
      populationChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: [],
          datasets: [{
            label: '該当データなし',
            data: [],
            backgroundColor: 'rgba(200,0,0,0.5)'
          }]
        },
        options: { responsive: true }
      });
      return;
    }
    // 表示ラベルは「市区町村」または「都道府県」  
    let labelKey = muniKey || prefKey || Object.keys(data[0])[0];

    const labels = data.map(row => row[labelKey]);
    // 数値は最初に見つかった該当カラムで
    const valueKey = sumKeys[0];
    const values = data.map(row => Number((row[valueKey] || '0').toString().replace(/,/g, '')));

    populationChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: valueKey,
          data: values,
          backgroundColor: 'rgba(54, 162, 235, 0.7)'
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }
</script>

</body>
</html>
