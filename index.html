<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>データ集計ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  .upload-section { margin-bottom: 20px; }
  canvas { max-width: 600px; margin-top: 30px; }
</style>
</head>
<body>

<h1>データ集計ダッシュボード</h1>

<div class="upload-section">
  <h3>CSVファイルアップロード</h3>

  <div>
    <label>CSV1: 人口・男女別データ</label><br/>
    <input type="file" id="file1" accept=".csv" />
    <button id="upload1">アップロード実行</button>
  </div>

  <div>
    <label>CSV2: 世帯の種類別データ</label><br/>
    <input type="file" id="file2" accept=".csv" />
    <button id="upload2">アップロード実行</button>
  </div>

  <div>
    <label>CSV3: 追加統計データ</label><br/>
    <input type="file" id="file3" accept=".csv" />
    <button id="upload3">アップロード実行</button>
  </div>
</div>

<div>
  <label for="municipalitySelect">市町村で絞り込み:</label>
  <select id="municipalitySelect">
    <option value="">--選択してください--</option>
  </select>
</div>

<div>
  <canvas id="chartPopulation"></canvas>
  <canvas id="chartHouseholds"></canvas>
  <canvas id="chartStats"></canvas>
</div>

<script>
  let data1 = null;
  let data2 = null;
  let data3 = null;
  let municipalities = new Set();

  function parseCSV(text) {
    // タブ区切りで分割固定 (TSV想定)
    const lines = text.trim().split('\n');
    const headers = lines[0].split('\t').map(h => h.trim());
    const rows = lines.slice(1).map(line => {
      const values = line.split('\t');
      let obj = {};
      headers.forEach((h, i) => {
        obj[h] = values[i]?.trim() || "";
      });
      return obj;
    });
    console.log("Parsed headers:", headers);
    return { headers, rows };
  }

  // 市町村列を「市区町村」または「市町村」を含む列名として検索
  function findMuniColumn(headers) {
    for (const h of headers) {
      if (/市区町村|市町村/.test(h)) {
        return h;
      }
    }
    return null;
  }

  function extractMunicipalities() {
    municipalities.clear();

    function addFromData(data) {
      if (!data) return;
      const muniCol = findMuniColumn(data.headers);
      if (!muniCol) {
        console.warn('市町村列を見つけられませんでした。headers:', data.headers);
        return;
      }
      data.rows.forEach(row => {
        const muni = row[muniCol];
        if (muni) municipalities.add(muni);
      });
    }

    addFromData(data1);
    addFromData(data2);
    addFromData(data3);

    const select = document.getElementById('municipalitySelect');
    select.innerHTML = '<option value="">--選択してください--</option>';
    Array.from(municipalities).sort().forEach(name => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });

    console.log("Municipalities loaded:", Array.from(municipalities));
  }

  function setupUpload(fileInputId, buttonId, dataVarName) {
    document.getElementById(buttonId).addEventListener('click', () => {
      const input = document.getElementById(fileInputId);
      if (!input.files || input.files.length === 0) {
        alert('ファイルを選択してください');
        return;
      }
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = parseCSV(e.target.result);
          window[dataVarName] = parsed;
          alert(file.name + ' をアップロードしました');
          extractMunicipalities();
          updateCharts();
        } catch (err) {
          alert('ファイルの読み込みに失敗しました');
          console.error(err);
        }
      };
      reader.readAsText(file, 'UTF-8');
    });
  }

  // グラフ関連は前回実装のまま利用します
  let chartPopulation = null;
  let chartHouseholds = null;
  let chartStats = null;

  function updateCharts() {
    const selected = document.getElementById('municipalitySelect').value;
    if (!selected) {
      clearAllCharts();
      return;
    }
    function findRowByMuni(data) {
      if (!data) return null;
      const muniCol = findMuniColumn(data.headers);
      if (!muniCol) return null;
      return data.rows.find(r => r[muniCol] === selected);
    }

    const row1 = findRowByMuni(data1);
    const row2 = findRowByMuni(data2);
    const row3 = findRowByMuni(data3);

    if (row1) {
      const labels = ['総数', '男', '女'];
      const values = [
        parseInt((row1['総数'] || '0').replace(/,/g, '')) || 0,
        parseInt((row1['男'] || '0').replace(/,/g, '')) || 0,
        parseInt((row1['女'] || '0').replace(/,/g, '')) || 0,
      ];
      drawChart('chartPopulation', '人口・男女別', labels, values);
    } else {
      clearChart('chartPopulation');
    }

    if (row2) {
      const labels = ['総数', '一般世帯', '施設等の世帯'];
      const values = [
        parseInt((row2['総数'] || '0').replace(/,/g, '')) || 0,
        parseInt((row2['一般世帯'] || '0').replace(/,/g, '')) || 0,
        parseInt((row2['施設等の世帯'] || '0').replace(/,/g, '')) || 0,
      ];
      drawChart('chartHouseholds', '世帯数の種類別', labels, values);
    } else {
      clearChart('chartHouseholds');
    }

    if (row3) {
      const labels = ['2020年人口', '2020年世帯数', '5年人口増減率（％）', '5年世帯増減率（％）'];
      const values = [
        parseInt((row3['2020年（令和2年）の人口（組替）【人】'] || '0').replace(/,/g, '')) || 0,
        parseInt((row3['2020年（令和2年）の世帯数（組替）【世帯】'] || '0').replace(/,/g, '')) || 0,
        parseFloat(row3['5年間の人口増減率【％】'] || 0),
        parseFloat(row3['5年間の世帯増減率【％】'] || 0),
      ];
      drawChart('chartStats', '追加統計データ', labels, values);
    } else {
      clearChart('chartStats');
    }
  }

  function drawChart(canvasId, title, labels, data) {
    const ctx = document.getElementById(canvasId).getContext('2d');
    if (!ctx) return;

    if (window[canvasId + 'Chart']) {
      window[canvasId + 'Chart'].destroy();
    }

    window[canvasId + 'Chart'] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: title,
          data: data,
          backgroundColor: ['#3366CC', '#DC3912', '#FF9900', '#109618'],
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: { display: true, text: title },
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }

  function clearChart(canvasId) {
    if (window[canvasId + 'Chart']) {
      window[canvasId + 'Chart'].destroy();
      window[canvasId + 'Chart'] = null;
    }
  }

  function clearAllCharts() {
    clearChart('chartPopulation');
    clearChart('chartHouseholds');
    clearChart('chartStats');
  }

  document.getElementById('municipalitySelect').addEventListener('change', updateCharts);

  setupUpload('file1', 'upload1', 'data1');
  setupUpload('file2', 'upload2', 'data2');
  setupUpload('file3', 'upload3', 'data3');

</script>
</body>
</html>
