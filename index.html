<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>データ集計ダッシュボード</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  h1 {
    margin-bottom: 15px;
  }
  .file-input-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-bottom: 5px;
  }
  select {
    margin-top: 10px;
    padding: 5px;
    min-width: 200px;
  }
  #charts {
    margin-top: 30px;
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
  }
  canvas {
    background: #f9f9f9;
    border: 1px solid #ddd;
    padding: 10px;
    max-width: 600px;
    max-height: 400px;
  }
  #filterInput {
    margin-top: 10px;
    padding: 5px;
    min-width: 200px;
    display: block;
  }
</style>
</head>
<body>

<h1>データ集計ダッシュボード</h1>

<div class="file-input-group">
  <label for="file1">１つ目のCSVを選択（男女別人口など）:</label>
  <input type="file" id="file1" accept=".csv" />
  <button id="upload1">アップロード1</button>
</div>

<div class="file-input-group">
  <label for="file2">２つ目のCSVを選択（世帯の種類別世帯数など）:</label>
  <input type="file" id="file2" accept=".csv" />
  <button id="upload2">アップロード2</button>
</div>

<div class="file-input-group">
  <label for="file3">３つ目のCSVを選択（2020年人口や人口密度など）:</label>
  <input type="file" id="file3" accept=".csv" />
  <button id="upload3">アップロード3</button>
</div>

<hr/>

<label for="filterInput">市区町村名で絞り込み検索:</label>
<input type="text" id="filterInput" placeholder="市区町村名で検索..." disabled />

<label for="municipalitySelect">市区町村を選択して絞り込み:</label>
<select id="municipalitySelect" disabled>
  <option>データをアップロードしてください</option>
</select>

<div id="charts">
  <canvas id="chart1" width="600" height="400"></canvas>
  <canvas id="chart2" width="600" height="400"></canvas>
  <canvas id="chart3" width="600" height="400"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// データ格納
const dataStore = {
  file1: null,
  file2: null,
  file3: null,
  municipalities: new Set(),
  combinedData: {}, // 市区町村名をキーにデータ統合
  allOptions: [],   // すべての選択肢（文字列）の保持（表示用）
};

// ダブルクォーテーション除去関数
function trimQuotes(str){
  return str.replace(/^"(.*)"$/, '$1');
}

// CSVパース関数（改良：全要素にtrim + ダブルクォーテーション除去）
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  let dataStartIndex = 0;
  for(let i=0; i<lines.length; i++){
    const line = lines[i].trim();
    if(line.match(/^\d{10,}/)){
      dataStartIndex = i;
      break;
    }
  }
  return lines.slice(dataStartIndex).map(line => {
    const arr = line.includes('\t') ? line.split('\t') : line.split(',');
    return arr.map(s => trimQuotes(s.trim()));
  });
}

function uploadFile(fileInputId, fileKey, processFunction){
  const input = document.getElementById(fileInputId);
  const file = input.files[0];
  if(!file){
    alert('ファイルを選択してください');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const text = e.target.result;
      const csvData = parseCSV(text);
      processFunction(csvData);
      updateMunicipalitySelect();
      alert(fileKey + ' のアップロードと処理が完了しました');
      // 検索入力有効化
      document.getElementById('filterInput').disabled = false;
      document.getElementById('filterInput').value = '';
    } catch(err) {
      alert('ファイルの処理中にエラーが発生しました: ' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

// 1つ目のCSV処理（男女別人口）
function processFile1(data){
  dataStore.file1 = {};
  data.forEach(row => {
    if(row.length < 10) return;
    const muni = row[5];
    if(!muni) return;
    const total = Number(row[7].replace(/,/g, '')) || 0;
    const male = Number(row[8].replace(/,/g, '')) || 0;
    const female = Number(row[9].replace(/,/g, '')) || 0;
    dataStore.file1[muni] = { total, male, female };
    dataStore.municipalities.add(muni);
  });
  mergeCombinedData();
}

// 2つ目のCSV処理（世帯の種類別世帯数など）
function processFile2(data){
  dataStore.file2 = {};
  data.forEach(row => {
    if(row.length < 13) return;
    const muni = row[5];
    if(!muni) return;
    const household_total = Number(row[7].replace(/,/g, '')) || 0;
    const household_general = Number(row[8].replace(/,/g, '')) || 0;
    const household_facility = Number(row[9].replace(/,/g, '')) || 0;
    const person_total = Number(row[10].replace(/,/g, '')) || 0;
    const person_general = Number(row[11].replace(/,/g, '')) || 0;
    const person_facility = Number(row[12].replace(/,/g, '')) || 0;
    dataStore.file2[muni] = { household_total, household_general, household_facility, person_total, person_general, person_facility };
    dataStore.municipalities.add(muni);
  });
  mergeCombinedData();
}

// 3つ目のCSV処理（2020年人口や人口密度など）
function processFile3(data){
  dataStore.file3 = {};
  data.forEach(row => {
    if(row.length < 16) return;
    const muni = row[5];
    if(!muni) return;
    const pop_2020 = Number(row[7].replace(/,/g, '')) || 0;
    const house_2020 = Number(row[8].replace(/,/g, '')) || 0;
    const pop_diff = Number(row[9].replace(/,/g, '')) || 0;
    const pop_diff_pct = Number(row[10].replace(/,/g, '')) || 0;
    const house_diff = Number(row[11].replace(/,/g, '')) || 0;
    const house_diff_pct = Number(row[12].replace(/,/g, '')) || 0;
    const sex_ratio = Number(row[13].replace(/,/g, '')) || 0;
    const area = Number(row[14].replace(/,/g, '')) || 0;
    const density = Number(row[15].replace(/,/g, '')) || 0;
    dataStore.file3[muni] = { pop_2020, house_2020, pop_diff, pop_diff_pct, house_diff, house_diff_pct, sex_ratio, area, density };
    dataStore.municipalities.add(muni);
  });
  mergeCombinedData();
}

// データ統合
function mergeCombinedData(){
  dataStore.combinedData = {};
  dataStore.municipalities.forEach(muni => {
    dataStore.combinedData[muni] = {
      ...dataStore.file1?.[muni],
      ...dataStore.file2?.[muni],
      ...dataStore.file3?.[muni],
    };
  });
  updateMunicipalitySelect();
}

// === プルダウン用選択肢を「全国、都道府県、市区町村（2000年含む）コード」の順に並べる ===
// 都道府県・市区町村などの区別は、現状データから判別不可能なので、便宜的に市区町村名を元に分類可能なら独自ルールでラベル付け
// ここでは例として「全国」「都道府県」「市区町村」の文字列を含むものを分類し、そうでなければ「市区町村」とみなします。
// 例がなければすべて一つのグループでソート表示
function sortMunicipalityOptions(options){
  // options: Array of municipality names (string)
  // 例として prefixわけ をする関数（必要に応じてカスタマイズしてください）
  const national = options.filter(name => name.includes('全国'));
  const prefectures = options.filter(name => !name.includes('全国') && name.includes('都道府県'));
  const others = options.filter(name => !name.includes('全国') && !name.includes('都道府県'));

  // それぞれをコードのような何かでソート（名前順）
  national.sort();
  prefectures.sort();
  others.sort();

  return [...national, ...prefectures, ...others];
}

// 実際ここでは明示的な全国・都道府県の区別がないので、
// 単純に全市区町村名を「全国」「都道府県」「市区町村」の3つのカテゴリに分けられません。
// もし別途コードなど情報があるならそれで振り分けてください。
// 一旦、municipalitiesの一覧をソートして作成し、
// 先頭に「全国（すべて）」、続いて都道府県、市区町村（昇順）として実装します。

// 市区町村プルダウン更新
function updateMunicipalitySelect(filter=""){
  const select = document.getElementById('municipalitySelect');
  if(dataStore.municipalities.size === 0){
    select.innerHTML = '<option>データをアップロードしてください</option>';
    select.disabled = true;
    document.getElementById('filterInput').disabled = true;
    clearCharts();
    return;
  }

  // すべての選択肢を作成（1回だけ作成）
  // 名称だけでなくコードフル表示はできないので名称のまま
  // 「全国」として特別に先頭に追加
  let allOptions = Array.from(dataStore.municipalities);

  // 先頭に「全国 - 全国」追加（任意）
  // また用途に応じて「全て」を入れる等変更可能
  if(!allOptions.includes("全国")){
    allOptions.unshift("全国");
  }

  // 都道府県名だけ抽出(例として都道府県は"都","道","府","県"で終わる名前)
  const prefOptions = allOptions.filter(name => {
    return ["都", "道", "府", "県"].some(suffix => name.endsWith(suffix));
  });

  // 市区町村は都道府県以外から全国を除いたもの
  const otherOptions = allOptions.filter(name => !prefOptions.includes(name) && name !== "全国");

  // ソート
  prefOptions.sort();
  otherOptions.sort();

  // 最終的な選択肢配列
  const finalOptions = ["全国", ...prefOptions, ...otherOptions];

  // 絞り込み（大文字小文字区別なく部分一致）
  let filteredOptions = finalOptions.filter(name => name.includes(filter));

  // 選択肢HTML生成
  let optionsHtml = '<option value="">-- 市区町村を選択 --</option>';
  filteredOptions.forEach(muni => {
    optionsHtml += `<option value="${muni}">${muni}</option>`;
  });
  select.innerHTML = optionsHtml;
  select.disabled = filteredOptions.length === 0;

  // 検索中に選択がリセットされることに対応してグラフクリア
  clearCharts();
}

// グラフ描画（省略、元コードと同じ）
let chart1=null, chart2=null, chart3=null;
function drawCharts(muni){
  if(!muni || !dataStore.combinedData[muni]){
    clearCharts();
    return;
  }
  const data = dataStore.combinedData[muni];

  const ctx1 = document.getElementById('chart1').getContext('2d');
  if(chart1) chart1.destroy();
  chart1 = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: ['総数', '男', '女'],
      datasets: [{
        label: muni + ' - 人口 (2025年)',
        data: [data.total||0, data.male||0, data.female||0],
        backgroundColor: ['#3e95cd', '#8e5ea2', '#3cba9f']
      }]
    },
    options: {
      responsive: false,
      scales: { y: { beginAtZero: true } }
    }
  });

  const ctx2 = document.getElementById('chart2').getContext('2d');
  if(chart2) chart2.destroy();
  chart2 = new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: ['世帯数総数', '一般世帯数', '施設等世帯数', '世帯人員総数', '一般世帯人員', '施設等世帯人員'],
      datasets: [{
        label: muni + ' - 世帯（2025年）',
        data: [
          data.household_total || 0,
          data.household_general || 0,
          data.household_facility || 0,
          data.person_total || 0,
          data.person_general || 0,
          data.person_facility || 0,
        ],
        backgroundColor: '#f28e2b'
      }]
    },
    options: {
      responsive: false,
      scales: { y: { beginAtZero: true } }
    }
  });

  const ctx3 = document.getElementById('chart3').getContext('2d');
  if(chart3) chart3.destroy();
  chart3 = new Chart(ctx3, {
    type: 'bar',
    data: {
      labels: [
        '2020年人口',
        '2020年世帯数',
        '5年間人口増減数',
        '5年間人口増減率(%)',
        '5年間世帯増減数',
        '5年間世帯増減率(%)',
        '人口性比',
        '面積(km²)',
        '人口密度(人/km²)'
      ],
      datasets: [{
        label: muni + ' - その他指標',
        data: [
          data.pop_2020 || 0,
          data.house_2020 || 0,
          data.pop_diff || 0,
          data.pop_diff_pct || 0,
          data.house_diff || 0,
          data.house_diff_pct || 0,
          data.sex_ratio || 0,
          data.area || 0,
          data.density || 0,
        ],
        backgroundColor: '#4e79a7'
      }]
    },
    options: {
      responsive: false,
      scales: { y: { beginAtZero: true } }
    }
  });
}

function clearCharts(){
  if(chart1) chart1.destroy();
  if(chart2) chart2.destroy();
  if(chart3) chart3.destroy();
  const ctx1 = document.getElementById('chart1').getContext('2d');
  ctx1.clearRect(0,0,600,400);
  const ctx2 = document.getElementById('chart2').getContext('2d');
  ctx2.clearRect(0,0,600,400);
  const ctx3 = document.getElementById('chart3').getContext('2d');
  ctx3.clearRect(0,0,600,400);
}

// イベント登録
document.getElementById('upload1').addEventListener('click',()=>uploadFile('file1','ファイル1',processFile1));
document.getElementById('upload2').addEventListener('click',()=>uploadFile('file2','ファイル2',processFile2));
document.getElementById('upload3').addEventListener('click',()=>uploadFile('file3','ファイル3',processFile3));

document.getElementById('municipalitySelect').addEventListener('change', e=>{
  drawCharts(e.target.value);
});
