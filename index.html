<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>データ集計ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  .upload-section { margin-bottom: 20px; }
  canvas { max-width: 600px; margin-top: 30px; }
</style>
</head>
<body>

<h1>データ集計ダッシュボード</h1>

<!-- アップロードセクション -->
<div class="upload-section">
  <h3>CSVファイルアップロード</h3>

  <div>
    <label>CSV1: 人口・男女別データ</label><br/>
    <input type="file" id="file1" accept=".csv" />
    <button id="upload1">アップロード実行</button>
  </div>

  <div>
    <label>CSV2: 世帯の種類別データ</label><br/>
    <input type="file" id="file2" accept=".csv" />
    <button id="upload2">アップロード実行</button>
  </div>

  <div>
    <label>CSV3: 追加統計データ</label><br/>
    <input type="file" id="file3" accept=".csv" />
    <button id="upload3">アップロード実行</button>
  </div>
</div>

<!-- 絞り込み -->
<div>
  <label for="municipalitySelect">市町村で絞り込み:</label>
  <select id="municipalitySelect">
    <option value="">--選択してください--</option>
  </select>
</div>

<!-- グラフ表示 -->
<div>
  <canvas id="chartPopulation"></canvas>
  <canvas id="chartHouseholds"></canvas>
  <canvas id="chartStats"></canvas>
</div>

<script>
  let data1 = null; // CSV1データ格納
  let data2 = null; // CSV2データ格納
  let data3 = null; // CSV3データ格納

  let municipalities = new Set();

  // Chart.jsインスタンスを保持
  let chartPopulation = null;
  let chartHouseholds = null;
  let chartStats = null;

  // ファイル読み込み＆パース関数（簡易版）
  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(/\t|,/);
    const rows = lines.slice(1).map(line => {
      const values = line.split(/\t|,/);
      let obj = {};
      headers.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : "");
      return obj;
    });
    return { headers, rows };
  }

  // 市町村名の抽出
  function extractMunicipalities() {
    municipalities.clear();
    function addFromData(data) {
      if (!data) return;
      data.rows.forEach(row => {
        const muni = row["全国、都道府県、市区町村（2000年市区町村含む）"];
        if (muni) municipalities.add(muni);
      });
    }
    addFromData(data1);
    addFromData(data2);
    addFromData(data3);

    const select = document.getElementById('municipalitySelect');
    // すでにあるoptionをクリア
    select.innerHTML = '<option value="">--選択してください--</option>';
    Array.from(municipalities).sort().forEach(name => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });
  }

  // ファイルアップロード処理
  function setupUpload(fileInputId, buttonId, dataVarName) {
    document.getElementById(buttonId).addEventListener('click', () => {
      const input = document.getElementById(fileInputId);
      if (!input.files || input.files.length === 0) {
        alert('ファイルを選択してください');
        return;
      }
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = parseCSV(e.target.result);
          window[dataVarName] = parsed;
          alert(file.name + ' をアップロードしました');
          extractMunicipalities();
          updateCharts();
        } catch (err) {
          alert('ファイルの読み込みに失敗しました');
          console.error(err);
        }
      };
      reader.readAsText(file, 'UTF-8');
    });
  }

  // グラフ描画更新
  function updateCharts() {
    const selected = document.getElementById('municipalitySelect').value;
    if (!selected) {
      clearCharts();
      return;
    }
    // 人口・男女別グラフ（CSV1）
    if (data1) {
      const filtered = data1.rows.filter(r => r["全国、都道府県、市区町村（2000年市区町村含む）"] === selected);
      if (filtered.length > 0) {
        const d = filtered[0];
        const labels = ['総数', '男', '女'];
        const values = [parseInt(d['総数'].replace(/,/g, '') || 0), parseInt(d['男'].replace(/,/g, '') || 0), parseInt(d['女'].replace(/,/g, '') || 0)];
        drawChart(chartPopulation, '人口・男女別', labels, values);
      }
    }
    // 世帯数グラフ（CSV2）
    if (data2) {
      const filtered = data2.rows.filter(r => r["全国、都道府県、市区町村（2000年市区町村含む）"] === selected);
      if (filtered.length > 0) {
        const d = filtered[0];
        // 「総数」「一般世帯」「施設等の世帯」 をたとえば表示（左側の項目を利用）
        // ここは、データ2の構成により若干変える必要あり、例として「総数", "一般世帯", "施設等の世帯"の最初の3列を使う。
        const labels = ['総数', '一般世帯', '施設等の世帯'];
        const values = [
          parseInt(d['総数'].replace(/,/g, '') || 0),
          parseInt(d['一般世帯'].replace(/,/g, '') || 0),
          parseInt(d['施設等の世帯'].replace(/,/g, '') || 0),
        ];
        drawChart(chartHouseholds, '世帯数の種類別', labels, values);
      }
    }
    // 追加統計グラフ（CSV3）
    if (data3) {
      const filtered = data3.rows.filter(r => r["全国、都道府県、市区町村（2000年市区町村含む）"] === selected);
      if (filtered.length > 0) {
        const d = filtered[0];
        const labels = ['2020年人口', '2020年世帯数', '5年人口増減率（％）', '5年世帯増減率（％）'];
        const values = [
          parseInt(d['2020年（令和2年）の人口（組替）【人】']?.replace(/,/g, '') || 0),
          parseInt(d['2020年（令和2年）の世帯数（組替）【世帯】']?.replace(/,/g, '') || 0),
          parseFloat(d['5年間の人口増減率【％】'] || 0),
          parseFloat(d['5年間の世帯増減率【％】'] || 0),
        ];
        drawChart(chartStats, '追加統計データ', labels, values);
      }
    }
  }

  function drawChart(chartInstance, title, labels, values) {
    if (chartInstance) {
      chartInstance.destroy();
    }
    const ctxId = title.replace(/\s/g, '') === '人口・男女別' ? 'chartPopulation' :
                  (title === '世帯数の種類別' ? 'chartHouseholds' : 'chartStats');
    const ctx = document.getElementById(ctxId).getContext('2d');
    if (!ctx) return;

    window['chart' + title.replace(/[\s・]/g, '')] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: title,
          data: values,
          backgroundColor: ['#3366CC', '#DC3912', '#FF9900', '#109618'],
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: { display: true, text: title },
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }

  function clearCharts() {
    [chartPopulation, chartHouseholds, chartStats].forEach(c => {
      if (c) {
        c.destroy();
      }
    });
  }

  // セレクトボックス更新対応
  document.getElementById('municipalitySelect').addEventListener('change', updateCharts);

  // 各アップロードボタンのセットアップ
  setupUpload('file1', 'upload1', 'data1');
  setupUpload('file2', 'upload2', 'data2');
  setupUpload('file3', 'upload3', 'data3');

</script>
</body>
</html>
